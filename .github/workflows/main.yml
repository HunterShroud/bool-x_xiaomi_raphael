name: Kernel Build CI

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm workflow triggered
        run: echo "✅ GitHub Actions workflow triggered successfully!"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev zip

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make raphael_defconfig

          # Adjust kernel config
          ./scripts/config --set-val CONFIG_MODULES y
          ./scripts/config --set-val CONFIG_MODULE_UNLOAD y
          ./scripts/config --set-val CONFIG_MODVERSIONS y
          ./scripts/config --disable CONFIG_MODULE_SIG
          ./scripts/config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --set-str CONFIG_MODULE_SIG_KEY ""
          ./scripts/config --disable CONFIG_IMA
          ./script
